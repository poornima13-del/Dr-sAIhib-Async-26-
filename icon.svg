<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00B8A9"/>
      <stop offset="50%" stop-color="#2D9CFF"/>
      <stop offset="100%" stop-color="#7B5CFA"/>
    </linearGradient>
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFC93C"/>
      <stop offset="100%" stop-color="#FF6B6B"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  
  <!-- Stethoscope / Medical Heartbeat Emblem -->
  <g filter="url(#shadow)">
    <!-- Shield / Heart silhouette -->
    <path d="M256 90 C340 30 450 110 420 220 C390 320 270 410 256 422 C242 410 122 320 92 220 C62 110 172 30 256 90 Z" fill="#ffffff" fill-opacity="0.95"/>
    
    <!-- Heartbeat Pulse Line -->
    <path d="M120 230 L180 230 L210 160 L245 295 L275 190 L300 245 L330 230 L392 230" fill="none" stroke="#00B8A9" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- AI badge center-bottom -->
    <rect x="176" y="325" width="160" height="64" rx="32" fill="url(#aiGrad)"/>
    <text x="256" y="369" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">AI DOC</text>
  </g>
  
  <!-- Caduceus / Cross indicator top -->
  <rect x="242" y="115" width="28" height="60" rx="10" fill="#7B5CFA"/>
  <rect x="226" y="131" width="60" height="28" rx="10" fill="#7B5CFA"/>
</svg>
